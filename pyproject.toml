[project]
name = "idle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "windows-curses>=2.4.2",
]

[project.optional-dependencies]
windows = ["windows-curses"]
dev = ["pytest", "ruff", "mypy", "pygame>=2.5"]
gui = ["pygame>=2.5"]

[project.scripts]
idle = "idle.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idle*"]

[tool.setuptools.package-data]
idle = ["data/*.txt", "data/snippets/*.txt"]
